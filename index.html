                <select class="select" id="deptFreq">
                  <option value="1">每轮 1 次</option>
                  <option value="2">每 2 轮 1 次</option>
                  <option value="3">每 3 轮 1 次</option>
                </select>
              </div>
              <div class="field">
                <label>面试官姓名（可留空）</label>
                <input class="input" id="deptPersonName" placeholder="例如：张三">
              </div>
              <div class="field">
                <label>职级</label>
                <select class="select" id="deptPersonRole">
                  <option value="中心负责人">中心负责人</option>
                  <option value="助理">助理</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" data-action="close-modal">取消</button>
            <button class="btn primary" data-action="save-add-dept"><i data-lucide="check"></i>保存</button>
          </div>
        </div>
      </div>
    `);
  }

  function saveAddDept() {
    const name = $("#deptName").value.trim();
    if (!name) {
      showToast("请填写部门名称", "warn");
      return;
    }
    const order = orderedDepartments().length;
    const personName = $("#deptPersonName").value.trim();
    const people = [];
    if (personName) {
      people.push({
        id: uid("p"),
        name: personName,
        role: $("#deptPersonRole").value,
        enabled: true,
        note: "",
        maxConsecutive: state.settings.maxConsecutivePerPerson || 1,
        unavailable: [],
      });
    }
    const dept = {
      id: uid("d"),
      name,
      shortName: $("#deptShort").value.trim() || name,
      order,
      frequency: parseInt($("#deptFreq").value, 10) || 1,
      color: ["#2563eb", "#0f766e", "#7c3aed", "#b45309", "#be123c", "#4f46e5", "#0d9488", "#d97706", "#db2777", "#059669", "#1d4ed8"][order % 11],
      note: "",
      people,
    };
    state.departments.push(dept);
    state.cursors.deptPassCounts[dept.id] = 0;
    closeModal();
    saveAndRender();
    showToast(`已新增部门${people.length ? "及面试官" : ""}`, "ok");
  }

  function addHost() {
    promptModal("新增主持人", "请输入主持人姓名", "", (name) => {
      if (!name.trim()) return;
      const fixedName = fixHostName(name.trim());
      if (state.hosts.some((h) => h.name === fixedName)) {
        showToast("该主持人已存在", "warn");
        return;
      }
      state.hosts.push({
        id: uid("host"),
        name: fixedName,
        enabled: true,
        note: "主持人",
        maxConsecutive: 1,
        unavailable: [],
      });
      saveAndRender();
      showToast("已新增主持人", "ok");
    });
  }

  function deleteDept(id) {
    const dept = findDept(id);
    if (!dept) return;
    if (!confirm(`确定删除部门 ${dept.name}？历史场次保留，但后续排班不再使用。`)) return;
    state.departments = state.departments.filter((d) => d.id !== id);
    state.cursors.deptPassCounts = Object.fromEntries(Object.entries(state.cursors.deptPassCounts || {}).filter(([k]) => k !== id));
    orderedDepartments().forEach((d, i) => { d.order = i; });
    saveAndRender();
  }

  function addUnavailable(personId) {
    const p = findPerson(personId);
    if (!p) return;
    openModal(`
      <div class="modal-backdrop">
        <div class="modal" style="width:480px">
          <div class="modal-head">
            <h2>添加不可用日期 · ${esc(p.name)}</h2>
            <button class="btn ghost icon-only" data-action="close-modal"><i data-lucide="x"></i></button>
          </div>
          <div class="modal-body">
            <div class="form-grid">
              <div class="field">
                <label>开始日期</label>
                <input class="input" id="unavStart" type="date">
              </div>
              <div class="field">
                <label>结束日期（可留空）</label>
                <input class="input" id="unavEnd" type="date">
              </div>
              <div class="field" style="grid-column:1/-1">
                <label>原因</label>
                <input class="input" id="unavLabel" placeholder="例如：出差 / 休产检 / 会议冲突">
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" data-action="close-modal">取消</button>
            <button class="btn primary" data-action="save-unavailable" data-id="${esc(personId)}"><i data-lucide="check"></i>保存</button>
          </div>
        </div>
      </div>
    `);
  }

  function saveUnavailable(personId) {
    const p = findPerson(personId);
    if (!p) return;
    const start = $("#unavStart").value;
    const end = $("#unavEnd").value;
    if (!start && !end) {
      showToast("请至少填写开始日期", "warn");
      return;
    }
    p.unavailable = p.unavailable || [];
    p.unavailable.push({ start: start || "", end: end || "", label: $("#unavLabel").value.trim() });
    closeModal();
    saveAndRender();
    showToast("不可用日期已添加", "ok");
  }

  function clearUnavailable(personId) {
    const p = findPerson(personId);
    if (!p) return;
    p.unavailable = [];
    saveAndRender();
  }

  function promptModal(title, placeholder, defaultValue, callback) {
    openModal(`
      <div class="modal-backdrop">
        <div class="modal" style="width:440px">
          <div class="modal-head">
            <h2>${esc(title)}</h2>
            <button class="btn ghost icon-only" data-action="close-modal"><i data-lucide="x"></i></button>
          </div>
          <div class="modal-body">
            <input class="input" id="promptValue" style="width:100%" placeholder="${esc(placeholder)}" value="${esc(defaultValue || "")}">
          </div>
          <div class="modal-foot">
            <button class="btn ghost" data-action="close-modal">取消</button>
            <button class="btn primary" data-action="confirm-prompt"><i data-lucide="check"></i>确定</button>
          </div>
        </div>
      </div>
    `);
    setTimeout(() => $("#promptValue")?.focus(), 50);
    window.__promptCallback = callback;
  }

  function addSession() {
    createDraftSession();
    openSessionModal("new");
  }

  function deleteSession(id) {
    if (id === "new") {
      closeModal();
      showToast("已放弃新增", "ok");
      return;
    }
    const s = state.sessions.find((x) => x.id === id);
    if (!s || !confirm(`确定删除 ${fmtDateCn(s.date)} 这场？`)) return;
    state.sessions = state.sessions.filter((x) => x.id !== id);
    closeModal();
    saveAndRender();
    showToast("场次已删除", "ok");
  }

  function saveSettings() {
    const heads = Math.max(1, parseInt($("#cfgHeads").value, 10) || 2);
    const assistants = Math.max(1, parseInt($("#cfgAssistants").value, 10) || 3);
    state.settings.headsPerSession = heads;
    state.settings.assistantsPerSession = assistants;
    state.settings.interviewersPerSession = heads + assistants;
    state.settings.maxConsecutivePerPerson = Math.max(1, parseInt($("#cfgConsec").value, 10) || 1);
    state.settings.hostPerSession = Math.max(0, parseInt($("#cfgHost").value, 10) || 0);
    const orgEl = document.getElementById("cfgOrg");
    state.settings.organizerPerSession = orgEl ? Math.max(0, parseInt(orgEl.value, 10) || 0) : 0;
    state.settings.defaultTime = $("#cfgTime").value.trim() || "14:00-14:40";
    state.settings.defaultMode = $("#cfgMode").value.trim() || "腾讯会议";
    state.settings.lockPassword = $("#cfgLockPwd")?.value.trim() || "123456";
    state.settings.weekdays = $$(".weekday-cb").filter((cb) => cb.checked).map((cb) => Number(cb.value));
    if (!state.settings.weekdays.length) state.settings.weekdays = [2, 4];
    saveAndRender();
    showToast("排班规则已保存", "ok");
  }

  document.addEventListener("click", (e) => {
    const actionEl = e.target.closest("[data-action]");
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    const id = actionEl.dataset.id;
    if (action === "toggle-dept") {
      e.preventDefault();
      e.stopPropagation();
      if (openDeptIds.has(id)) openDeptIds.delete(id);
      else openDeptIds.add(id);
      renderRoster();
      return;
    }
    if (action === "nav-view" || action === "go-auto") {
      setView(action === "go-auto" ? "auto" : actionEl.dataset.view);
      return;
    }
    if (action === "close-modal") { closeModal(); return; }
    if (action === "export-excel-btn") { exportExcel(); return; }
    if (action === "export-json-btn") {
      downloadFile("面试官轮值排班数据.json", JSON.stringify(state, null, 2), "application/json");
      showToast("已导出 JSON", "ok");
      return;
    }
    if (action === "reset") { resetToSeed(); return; }
    if (action === "fill-upcoming") { fillUpcoming(); return; }
    if (action === "clear-auto") {
      if (confirm("确定清空所有未锁定名额？")) clearAutoAssignments();
      return;
    }
    if (action === "reset-cursor") {
      if (confirm("确定重置轮值指针？")) resetCursor();
      return;
    }
    if (action === "skip-current") { skipCurrentRotation(); return; }
    if (action === "cal-prev") {
      calendarWeekStart = addDays(calendarWeekStart || todayIso(), -7);
      renderCalendar();
      return;
    }
    if (action === "cal-next") {
      calendarWeekStart = addDays(calendarWeekStart || todayIso(), 7);
      renderCalendar();
      return;
    }
    if (action === "cal-today") {
      calendarWeekStart = startOfWeekIso(todayIso());
      renderCalendar();
      return;
    }
    if (action === "cal-view") {
      calendarView = actionEl.dataset.view;
      renderCalendar();
      return;
    }
    if (action === "calendar-filter") {
      calendarFilter = actionEl.dataset.filter;
      renderCalendar();
      return;
    }
    if (action === "records-filter") {
      recordsFilter = actionEl.dataset.filter;
      renderRecords();
      return;
    }
    if (action === "complete-todo") {
      const session = state.sessions.find((s) => s.id === id);
      if (session) {
        if (!sessionUnlocked(session)) { showToast("场次已锁定，请先解锁", "warn"); return; }
        if (actionEl.dataset.step === "form") session.formConfirmed = true;
        if (actionEl.dataset.step === "ticket") session.ticketReady = true;
        saveAndRender();
        showToast("已完成，待办已更新", "ok");
      }
      return;
    }
    if (action === "undo-todo") {
      const session = state.sessions.find((s) => s.id === id);
      if (!session) return;
      if (!sessionUnlocked(session)) { showToast("场次已锁定，请先解锁", "warn"); return; }
      const step = actionEl.dataset.step;
      if (step === "schedule" && !confirm("确定撤回排班？将清空本场未锁定的面试官。")) return;
      if (step === "form") session.formConfirmed = false;
      if (step === "ticket") session.ticketReady = false;
      if (step === "notice") session.notified = false;
      if (step === "schedule") session.interviewers = (session.interviewers || []).filter((iv) => iv.locked);
      saveAndRender();
      showToast("已撤回，待办已恢复", "ok");
      return;
    }
    if (action === "enable-notify") { enableGroupReminder(); return; }
    if (action === "generate-sessions") {
      const count = Math.max(1, parseInt($("#genCount").value, 10) || 4);
      const start = $("#genStart").value || todayIso();
      generateSessions(count, start);
      return;
    }
    if (action === "save-settings") { saveSettings(); return; }
    if (action === "add-session") { addSession(); return; }
    if (action === "edit-session") { openSessionModal(id); return; }
    if (action === "copy-notice") {
      const session = id === "new" ? draftSession : state.sessions.find((s) => s.id === id);
      if (session) {
        if (id !== "new") {
          session.notified = true;
          saveState();
        }
        const dl = sendDeadlineForSession(session);
        copyText(buildNoticeText(session), `通知已复制，本场请在 ${dl ? deadlineLabel(dl) : "周一/周三 15:00"} 前发到【集团职能中心直属群】`);
      }
      return;
    }
    if (action === "fill-session") {
      if (id === "new") {
        if (!draftSession) return;
        const cursorBackup = deepClone(state.cursors);
        state.sessions.push(draftSession);
        const result = fillSession(draftSession);
        state.sessions = state.sessions.filter((s) => s.id !== draftSession.id);
        draftCursorSnapshot = deepClone(state.cursors);
        state.cursors = cursorBackup;
        draftHostAdvanced = false;
        openSessionModal("new");
        showToast(`已排 ${result.filled} 人`, result.warnings.length ? "warn" : "ok");
        return;
      }
      const session = state.sessions.find((s) => s.id === id);
      if (!session) return;
      if (!sessionUnlocked(session)) { showToast("场次已锁定，请先解锁", "warn"); return; }
      const result = fillSession(session);
      const fromModal = Boolean(actionEl.closest(".modal"));
      if (fromModal) {
        openSessionModal(id);
      } else if (currentView === "schedule") {
        saveAndRender();
      } else {
        closeModal();
        saveAndRender();
      }
      showToast(`已排 ${result.filled} 人`, result.warnings.length ? "warn" : "ok");
      return;
    }
    if (action === "save-session") { saveSessionFromModal(); return; }
    if (action === "delete-session") { deleteSession(id); return; }
    if (action === "add-slot") {
      const session = selectedSessionId === "new" ? draftSession : state.sessions.find((s) => s.id === selectedSessionId);
      if (!session) return;
      const slots = session.interviewers || [];
      const next = slots.length ? Math.max(...slots.map((x) => x.slot)) + 1 : 0;
      session.interviewers = [...slots, { slot: next, deptId: "", personId: "", locked: false }];
      openSessionModal(selectedSessionId);
      return;
    }
    if (action === "add-person") { addPerson(id); return; }
    if (action === "delete-person") { deletePerson(id); return; }
    if (action === "toggle-person") { togglePerson(id); return; }
    if (action === "add-unavailable") { addUnavailable(id); return; }
    if (action === "save-unavailable") { saveUnavailable(id); return; }
    if (action === "clear-unavailable") { clearUnavailable(id); return; }
    if (action === "add-dept") { addDept(); return; }
    if (action === "save-add-dept") { saveAddDept(); return; }
    if (action === "add-host") { addHost(); return; }
    if (action === "delete-dept") { deleteDept(id); return; }
    if (action === "move-dept-up") { moveDept(id, -1); return; }
    if (action === "move-dept-down") { moveDept(id, 1); return; }
    if (action === "toggle-host") {
      const h = findHost(id);
      if (h) { h.enabled = !h.enabled; saveAndRender(); }
      return;
    }
    if (action === "toggle-organizer") {
      const o = findOrganizer(id);
      if (o) { o.enabled = !o.enabled; saveAndRender(); }
      return;
    }
    if (action === "toggle") {
      const btn = actionEl;
      btn.classList.toggle("on");
      btn.dataset.on = btn.classList.contains("on") ? "1" : "0";
      btn.setAttribute("aria-checked", btn.classList.contains("on") ? "true" : "false");
      return;
    }
    if (action === "confirm-prompt") {
      const cb = window.__promptCallback;
      const value = $("#promptValue")?.value || "";
      closeModal();
      if (cb) cb(value);
      window.__promptCallback = null;
      return;
    }
  });

  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.id === "scheduleSearch") {
      scheduleQuery = el.value;
      renderSchedule();
      return;
    }
    if (el.id === "scheduleStatusFilter") {
      scheduleStatus = el.value;
      renderSchedule();
      return;
    }
    if (el.id === "calDate") {
      calendarWeekStart = startOfWeekIso(el.value);
      renderCalendar();
      return;
    }
    if (el.classList.contains("slot-dept")) {
      refreshModalSlotPeople();
      return;
    }
    const path = el.dataset.path;
    if (path) {
      setByPath(path, el.value, el.dataset.type || "string");
      saveAndRender();
    }
  });

  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.id === "scheduleSearch") {
      scheduleQuery = el.value;
      clearTimeout(window.__searchTimer);
      window.__searchTimer = setTimeout(() => renderSchedule(), 180);
      return;
    }
    if (el.id === "genCount") {
      const btn = document.getElementById("genBtn");
      if (btn) {
        const count = Math.max(1, parseInt(el.value, 10) || 1);
        btn.innerHTML = `<i data-lucide="calendar-plus"></i>生成未来 ${count} 场`;
        if (window.lucide) window.lucide.createIcons(btn);
      }
    }
  });

  document.getElementById("globalSearch").addEventListener("input", (e) => {
    scheduleQuery = e.target.value;
    if (currentView === "calendar") {
      clearTimeout(window.__globalSearchTimer);
      window.__globalSearchTimer = setTimeout(() => renderCalendar(), 180);
    }
  });

  document.getElementById("globalSearch").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      scheduleQuery = e.target.value.trim();
      if (currentView !== "calendar") setView("calendar");
      else renderCalendar();
    }
  });

  $$(".nav-item").forEach((btn) => btn.addEventListener("click", () => setView(btn.dataset.view)));

  window.addEventListener("storage", (event) => {
    if (event.key === STORAGE_KEY && event.newValue) {
      try {
        state = normalizeState(JSON.parse(event.newValue));
        markPassedSessions();
        renderCurrentView();
        showToast("已同步其他标签页的更新", "ok");
      } catch (err) {
        console.warn("同步失败", err);
      }
    }
  });

  async function initServerMode() {
    try {
      const res = await fetch(`${API_BASE}/api/state`);
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.departments && data.sessions) {
        serverMode = true;
        state = normalizeState(data);
        markPassedSessions();
        saveState();
        renderCurrentView();
        const el = document.getElementById("serverStatus");
        if (el) {
          el.textContent = "服务器同步中";
          el.style.color = "var(--green)";
        }
        setInterval(pollServerState, 4000);
      }
    } catch (err) {
      console.warn("服务器不可用，使用本地模式", err);
      const el = document.getElementById("serverStatus");
      if (el) {
        el.textContent = "本地模式";
        el.style.color = "var(--muted)";
      }
    }
  }

  async function pollServerState() {
    if (!serverMode) return;
    if (document.getElementById("modalRoot").innerHTML) return;
    try {
      const res = await fetch(`${API_BASE}/api/state`);
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.departments && data.sessions) {
        const local = JSON.stringify(state);
        const remote = JSON.stringify(data);
        if (remote !== local) {
          state = normalizeState(data);
          markPassedSessions();
          renderCurrentView();
        }
      }
    } catch (err) {
      console.warn("同步失败", err);
    }
  }

  state = loadState();
  markPassedSessions();
  saveState();
  setView("dashboard");
  initServerMode();
  setInterval(() => {
    if (markPassedSessions()) renderCurrentView();
  }, 60000);
})();

</script>
</body>
</html>
