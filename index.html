<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面试官轮值排班台</title>
  <style>
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --panel-soft: #fdf8f2;
  --border: #eee2d6;
  --border-strong: #dcc9b4;
  --text: #2c1d17;
  --muted: #7a6255;
  --accent: #c43c1f;
  --accent-soft: #fdeae3;
  --blue: #c07a0a;
  --blue-soft: #fdf0d5;
  --amber: #b45309;
  --amber-soft: #fdf0dd;
  --rose: #b91c1c;
  --rose-soft: #fde8e8;
  --green: #b42318;
  --green-soft: #fdece8;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(74, 42, 20, .05), 0 8px 24px rgba(74, 42, 20, .08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button { cursor: pointer; }

.topbar {
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  display: grid;
  place-items: center;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-weight: 700;
}

.brand strong {
  display: block;
  font-size: 16px;
  white-space: nowrap;
}

.brand-sub {
  display: block;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.save-state {
  color: var(--muted);
  font-size: 12px;
  margin-right: 4px;
  white-space: nowrap;
}

.server-status {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 34px;
  padding: 6px 11px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  color: var(--text);
  white-space: nowrap;
  transition: background .15s ease, border-color .15s ease, transform .1s ease;
}

.btn:hover { background: var(--panel-soft); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #a83118; }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.blue:hover { background: #9c6408; }
.btn.danger { background: var(--rose); border-color: var(--rose); color: #fff; }
.btn.danger:hover { background: #9c1717; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 28px; padding: 3px 8px; font-size: 13px; }
.btn.icon-only { width: 34px; padding: 0; }
.danger-text { color: var(--rose); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }

.app-shell {
  display: flex;
  min-height: calc(100vh - 58px);
}

.sidebar {
  width: 216px;
  flex: 0 0 216px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 14px 10px;
  background: var(--panel);
  border-right: 1px solid var(--border);
}

.nav { display: flex; flex-direction: column; gap: 4px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 40px;
  padding: 8px 12px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  text-align: left;
}

.nav-item:hover { background: var(--panel-soft); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item svg { width: 17px; height: 17px; }

.sidebar-foot {
  padding: 12px 10px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
}

.sidebar-foot p { margin: 0; }

.main {
  flex: 1;
  min-width: 0;
  padding: 20px 22px 40px;
}

.view { display: none; }
.view.active { display: block; animation: fadeIn .18s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: none; }
}

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.page-title {
  margin: 0;
  font-size: 20px;
  line-height: 1.3;
}

.page-desc {
  margin: 4px 0 0;
  color: var(--muted);
  max-width: 720px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.toolbar .spacer { flex: 1; }

.input, .select, .textarea {
  min-height: 34px;
  padding: 6px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  outline: none;
}

.input::placeholder, .textarea::placeholder {
  color: var(--muted);
  opacity: .8;
}

.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, .12);
}

.textarea { min-height: 74px; resize: vertical; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.panel-pad { padding: 16px; }

.process-steps {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.process-step {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 6px;
  box-shadow: var(--shadow);
}

.process-step h3 {
  margin: 0 0 4px;
  font-size: 15px;
}

.process-step p {
  margin: 0 0 10px;
  color: var(--muted);
  line-height: 1.6;
}

.process-num {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 16px;
  background: var(--panel-soft);
  border-bottom: 1px solid var(--border);
}
.panel-head h2, .panel-head h3 { margin: 0; font-size: 15px; }
.panel-head .sub { color: var(--muted); font-size: 12px; font-weight: 400; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}

.stat .label {
  color: var(--muted);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat .value {
  font-size: 26px;
  font-weight: 700;
  margin-top: 4px;
  line-height: 1.2;
}

.stat .value.small { font-size: 17px; }
.stat .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.stat.accent { border-top: 3px solid var(--accent); }
.stat.blue { border-top: 3px solid var(--blue); }
.stat.amber { border-top: 3px solid var(--amber); }
.stat.rose { border-top: 3px solid var(--rose); }

.grid-2 {
  display: grid;
  grid-template-columns: 1.4fr .9fr;
  gap: 14px;
  align-items: start;
}

.stack { display: flex; flex-direction: column; gap: 14px; }

.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius);
}

table.grid-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
}

.grid-table th {
  background: #fbf1e6;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.grid-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

.grid-table tr:last-child td { border-bottom: 0; }
.grid-table tbody tr { transition: background .12s ease; }
.grid-table tbody tr:hover { background: var(--panel-soft); }
.grid-table .num { font-variant-numeric: tabular-nums; }

.date-cell {
  white-space: nowrap;
  font-weight: 600;
}

.date-cell small { display: block; color: var(--muted); font-weight: 400; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 1.6;
  border: 1px solid transparent;
  white-space: nowrap;
  max-width: 100%;
}

.chip .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: 0 0 7px;
  background: currentColor;
  opacity: .7;
}

.chip.missing { background: var(--rose-soft); color: var(--rose); }
.chip.warn { background: var(--amber-soft); color: var(--amber); }
.chip.ok { background: var(--green-soft); color: var(--green); }
.chip.neutral { background: #eef1f4; color: var(--muted); }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12px;
  white-space: nowrap;
}

.status-pill.todo { background: var(--amber-soft); color: var(--amber); }
.status-pill.done { background: var(--green-soft); color: var(--green); }
.status-pill.cancel { background: #eef1f4; color: var(--muted); }
.status-pill.confirmed { background: #e8f0ff; color: #2563eb; }
.status-pill.pending { background: var(--amber-soft); color: var(--amber); }
.status-pill.notice { background: #fdeedb; color: #c2540a; }
.status-pill.error { background: var(--rose-soft); color: var(--rose); }

.empty {
  padding: 34px 16px;
  text-align: center;
  color: var(--muted);
}

.empty .big { font-size: 15px; font-weight: 600; color: var(--text); }
.empty p { margin: 6px 0 0; }

.recent-list { display: flex; flex-direction: column; }
.recent-card { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.recent-card:last-child { border-bottom: 0; }
.recent-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.recent-head strong { font-size: 14px; }
.recent-candidate { margin-top: 6px; font-weight: 600; }
.recent-meta { margin-top: 4px; color: var(--muted); font-size: 13px; }
.warn-line { margin: 8px 0; color: var(--amber); font-size: 12px; }

.todo-list { padding: 4px 16px 12px; }
.todo-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.todo-item:last-child { border-bottom: 0; }
.todo-mark { width: 20px; flex: 0 0 20px; text-align: center; }
.todo-text { flex: 1; min-width: 0; }
.todo-clear { color: var(--green); }
.todo-group { padding: 12px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.todo-done { color: var(--muted); }
.todo-title { font-weight: 600; }
.todo-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.todo-step-main { font-size: 15px; font-weight: 700; }
.todo-tags { margin-top: 4px; }

.rotation-now { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-soft); }
.rotation-now span { color: var(--muted); }
.rotation-now strong { text-align: right; }

.calendar-week { display: grid; grid-template-columns: repeat(7, minmax(140px, 1fr)); overflow-x: auto; }
.calendar-day { min-height: 320px; border-right: 1px solid var(--border); padding: 8px; }
.calendar-day:last-child { border-right: 0; }
.calendar-day.today { background: var(--accent-soft); }
.cal-day-head { display: flex; justify-content: space-between; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
.cal-day-head span { color: var(--muted); font-size: 12px; }
.cal-session { padding: 8px; margin-bottom: 8px; border: 1px solid var(--border); border-left: 3px solid var(--muted); border-radius: 6px; cursor: pointer; background: var(--panel); }
.cal-session.done { border-left-color: var(--green); }
.cal-session.confirmed { border-left-color: #2563eb; }
.cal-session.pending { border-left-color: var(--amber); }
.cal-session.notice { border-left-color: #c2540a; }
.cal-session.error { border-left-color: var(--rose); }
.cal-session.cancel { border-left-color: #94a3b8; }
.cal-time { font-weight: 700; font-size: 12px; }
.cal-name { font-weight: 600; margin: 2px 0; }
.cal-interviewers { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.cal-empty { color: var(--muted); text-align: center; padding: 10px 0; }

.rotation-chain { display: flex; align-items: stretch; gap: 6px; overflow-x: auto; padding: 16px; }
.chain-node { flex: 0 0 auto; min-width: 108px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); text-align: center; }
.chain-node.current { border-color: var(--accent); background: var(--accent-soft); }
.chain-node.paused { opacity: .65; }
.chain-center { font-weight: 700; }
.chain-person { color: var(--muted); font-size: 12px; margin: 4px 0; }
.chain-status { font-size: 12px; color: var(--green); }
.chain-node.current .chain-status { color: var(--accent); }
.chain-node.paused .chain-status { color: var(--rose); }
.chain-arrow { align-self: center; color: var(--muted); flex: 0 0 auto; }

.dept-block { margin-bottom: 14px; }
.dept-block > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  user-select: none;
}
.dept-block > summary::-webkit-details-marker { display: none; }

.dept-color {
  width: 10px;
  height: 28px;
  border-radius: 3px;
  flex: 0 0 10px;
}

.dept-name { font-weight: 600; }
.dept-meta { color: var(--muted); font-size: 12px; }
.dept-summary-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px 16px;
}

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field .help { font-size: 11px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; }
.field.check { flex-direction: row; align-items: center; gap: 8px; }
.field.check input { width: auto; }

.switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 36px;
  height: 20px;
  border-radius: 999px;
  background: var(--border-strong);
  transition: background .15s ease;
  border: 0;
  flex: 0 0 36px;
}

.switch::after {
  content: "";
  position: absolute;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: left .15s ease;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
}

.switch.on { background: var(--accent); }
.switch.on::after { left: 18px; }

.person-row {
  display: grid;
  grid-template-columns: minmax(130px, 1.2fr) minmax(90px, .7fr) 90px 90px 1.4fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px 14px;
  border-top: 1px solid var(--border);
}

.person-row:first-of-type { border-top: 0; }
.person-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person-note { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count-line { color: var(--muted); font-size: 12px; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 32, .42);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 44px 16px;
  z-index: 50;
  overflow: auto;
}

.modal {
  width: min(920px, 100%);
  background: var(--panel);
  border-radius: var(--radius);
  box-shadow: 0 24px 80px rgba(15, 23, 32, .25);
  border: 1px solid var(--border);
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}

.modal-head h2 { margin: 0; font-size: 17px; }
.modal-body { padding: 18px; }
.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 13px 18px;
  border-top: 1px solid var(--border);
}

.slot-list { display: flex; flex-direction: column; gap: 10px; }
.slot-row {
  display: grid;
  grid-template-columns: 150px minmax(150px, 1fr) minmax(150px, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-soft);
}

.slot-index {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}

.lock-row { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }

.warn-box {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: 6px;
  background: var(--amber-soft);
  color: var(--amber);
  font-size: 13px;
  margin-bottom: 12px;
}

.warn-box svg { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 2px; }
.warn-box ul { margin: 0; padding-left: 18px; }

.rule-note {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 6px 6px 0;
  color: #155e58;
  font-size: 13px;
}

.rule-note p { margin: 0 0 4px; }
.rule-note ul { margin: 0; padding-left: 18px; }

.notice-banner {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 14px;
  margin-bottom: 14px;
  border: 1px solid #eed7b8;
  border-left: 4px solid var(--amber);
  border-radius: 6px;
  background: var(--amber-soft);
  color: #7a4a12;
  font-size: 13px;
}

.notice-banner svg { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 2px; }
.notice-banner p { margin: 0; line-height: 1.6; }

.toast-root {
  position: fixed;
  right: 18px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 80;
}

.toast {
  min-width: 220px;
  max-width: 360px;
  padding: 10px 14px;
  border-radius: 6px;
  background: #17222e;
  color: #fff;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .22);
  font-size: 13px;
  animation: toastIn .18s ease;
}

.toast.ok { background: #0f766e; }
.toast.warn { background: #b45309; }
.toast.error { background: #be123c; }

@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.mini-bar {
  height: 6px;
  border-radius: 999px;
  background: #edf1f4;
  overflow: hidden;
}

.mini-bar > span { display: block; height: 100%; border-radius: 999px; }

@media (max-width: 980px) {
  .app-shell { flex-direction: column; }
  .sidebar {
    width: 100%;
    flex: 0 0 auto;
    flex-direction: row;
    align-items: center;
    padding: 8px 12px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
  .nav { flex-direction: row; overflow-x: auto; flex: 1; }
  .nav-item { width: auto; white-space: nowrap; justify-content: center; min-height: 36px; }
  .sidebar-foot { display: none; }
  .grid-2 { grid-template-columns: 1fr; }
  .topbar { flex-wrap: wrap; height: auto; padding: 10px 14px; }
  .person-row { grid-template-columns: 1fr 1fr; }
  .slot-row { grid-template-columns: 40px 1fr; }
}

@media (max-width: 640px) {
  .main { padding: 14px 12px 32px; }
  .topbar-actions .btn span { display: none; }
  .brand-sub { display: none; }

  <script>
(() => {

  const API_BASE = (new URLSearchParams(location.search).get("api") || window.SCHEDULER_API_BASE || "").replace(/\/$/, "");
  let state = null;
  let currentView = "dashboard";
  let openDeptIds = new Set();
  let scheduleQuery = "";
  let scheduleStatus = "all";
  let selectedSessionId = null;
  let draftSession = null;
  let draftHostAdvanced = false;
  let draftCursorSnapshot = null;
  let calendarWeekStart = null;
  let calendarView = "week";
  let calendarFilter = "all";
  let recordsFilter = "all";
  let serverMode = false;
  let serverSaveTimer = null;

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function deepClone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function uid(prefix) {
    return (prefix || "id") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    }[c]));
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function parseDate(value) {
    if (!value) return null;
    const m = String(value).match(/^(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})日?/);
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }

  function dateKey(date) {
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  function todayIso() {
    return dateKey(new Date());
  }

  function fmtDateCn(value) {
    const d = parseDate(value);
    return d ? `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日` : (value || "-");
  }

  function fmtDateShort(value) {
    const d = parseDate(value);
    return d ? `${d.getMonth() + 1}月${d.getDate()}日` : (value || "-");
  }

  function fmtDateShortWeekday(value) {
    const d = parseDate(value);
    return d ? `${d.getMonth() + 1}月${d.getDate()}日（周${"日一二三四五六"[d.getDay()]}）` : (value || "-");
  }

  function addDays(value, days) {
    const d = parseDate(value);
    if (!d) return todayIso();
    d.setDate(d.getDate() + days);
    return dateKey(d);
  }

  function orderedDepartments() {
    return [...state.departments].sort((a, b) => (a.order || 0) - (b.order || 0));
  }

  function findDept(id) {
    return state.departments.find((d) => d.id === id) || null;
  }

  function findPerson(id) {
    for (const dept of state.departments) {
      const p = dept.people.find((x) => x.id === id);
      if (p) return p;
    }
    return null;
  }

  function findHost(id) {
    return state.hosts.find((h) => h.id === id) || null;
  }

  function findOrganizer(id) {
    return state.organizers.find((o) => o.id === id) || null;
  }

  function sortSessions(list) {
    return [...list].sort((a, b) => {
      const da = parseDate(a.date);
      const db = parseDate(b.date);
      if (da && db && da.getTime() !== db.getTime()) return da.getTime() - db.getTime();
      return (a.time || "").localeCompare(b.time || "");
    });
  }

  function sortSessionsDesc(list) {
    return [...list].sort((a, b) => {
      const da = parseDate(a.date);
      const db = parseDate(b.date);
      if (da && db && da.getTime() !== db.getTime()) return db.getTime() - da.getTime();
      return (b.time || "").localeCompare(a.time || "");
    });
  }

  function sessionIsFull(session) {
    const need = Math.max(1, state.settings.interviewersPerSession || 5);
    return (session.interviewers || []).filter((iv) => iv.personId).length >= need;
  }

  function sessionIsPassed(session) {
    const d = parseDate(session.date);
    if (!d) return false;
    const today = new Date();
    const sessionDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    if (sessionDay < todayDay) return true;
    if (sessionDay > todayDay) return false;
    const endPart = (session.time || "").split("-")[1] || "";
    const match = endPart.trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!match) return false;
    const endHour = Number(match[1]);
    const endMinute = Number(match[2]);
    return today.getHours() > endHour || (today.getHours() === endHour && today.getMinutes() >= endMinute);
  }

  function markPassedSessions() {
    let changed = false;
    for (const s of state.sessions) {
      if (s.status === "待安排" && sessionIsPassed(s)) {
        s.status = "已开展";
        changed = true;
      }
    }
    if (changed) saveState();
    return changed;
  }

  function startOfWeekIso(dateValue) {
    const d = parseDate(dateValue || todayIso());
    if (!d) return todayIso();
    const day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    return dateKey(d);
  }

  function sessionHasPausedPerson(session) {
    return (session.interviewers || []).some((iv) => {
      const p = findPerson(iv.personId);
      return p && !p.enabled;
    });
  }

  function sessionProgress(session) {
    if (session.status === "已取消") return { label: "已取消", tone: "cancel" };
    if (session.status === "已开展") return { label: "已完成", tone: "done" };
    if (sessionHasPausedPerson(session)) return { label: "异常", tone: "error" };
    const full = sessionIsFull(session) && Boolean(hostDisplayName(session));
    if (!full) return { label: "待确认", tone: "pending" };
    if (!session.notified) return { label: "待通知", tone: "notice" };
    return { label: "已确认", tone: "confirmed" };
  }

  function currentRotationInfo() {
    const headDepts = orderedDepartments().filter((d) => d.people.some((p) => p.enabled && p.role === "中心负责人"));
    const assistantDepts = orderedDepartments().filter((d) => d.people.some((p) => p.enabled && p.role === "助理"));
    const headIndex = (state.cursors.headIndex || 0) % Math.max(1, headDepts.length);
    const assistantIndex = (state.cursors.assistantIndex || 0) % Math.max(1, assistantDepts.length);
    const headDept = headDepts[headIndex] || null;
    const nextHeadDept = headDepts[(headIndex + 1) % Math.max(1, headDepts.length)] || null;
    const assistantDept = assistantDepts[assistantIndex] || null;
    const probe = { date: todayIso(), mode: "腾讯会议", candidates: "" };
    const currentPerson = headDept ? pickPersonForDeptRole(headDept, probe, new Set(), "head") : null;
    const nextPerson = nextHeadDept ? pickPersonForDeptRole(nextHeadDept, probe, new Set(), "head") : null;
    const currentAssistant = assistantDept ? pickPersonForDeptRole(assistantDept, probe, new Set(), "assistant") : null;
    return { headDepts, headDept, currentPerson, nextHeadDept, nextPerson, assistantDept, currentAssistant, headIndex, assistantIndex };
  }

  function todoItems() {
    const items = [];
    const sessions = sortSessions(state.sessions.filter((s) => s.status !== "已取消"));
    const byTime = new Map();
    for (const s of sessions) {
      const key = `${s.date}|${s.time}`;
      if (!byTime.has(key)) byTime.set(key, []);
      byTime.get(key).push(s);
    }
    for (const s of sessions) {
      const progress = sessionProgress(s);
      if (!sessionIsFull(s)) items.push({ type: "interviewer", text: `${fmtDateShort(s.date)} ${s.time || ""} 场次缺少面试官`, session: s });
      if (!hostDisplayName(s)) items.push({ type: "host", text: `${fmtDateShort(s.date)} ${s.time || ""} 场次缺少主持人`, session: s });
      if (progress.label === "待通知") items.push({ type: "notice", text: `${fmtDateShort(s.date)} ${s.time || ""} 尚未发送通知`, session: s });
      if (sessionHasPausedPerson(s)) items.push({ type: "paused", text: `${fmtDateShort(s.date)} 暂停中的面试官被安排`, session: s });
    }
    for (const list of byTime.values()) {
      if (list.length > 1) {
        for (const s of list) items.push({ type: "conflict", text: `${fmtDateShort(s.date)} ${s.time || ""} 存在时间冲突`, session: s });
      }
    }
    const seen = new Set();
    return items.filter((item) => {
      const key = `${item.type}|${item.session.id}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).sort((a, b) => (parseDate(a.session.date) || 0) - (parseDate(b.session.date) || 0));
  }

  function processTodos() {
    const items = [];
    const sessions = sortSessions(state.sessions.filter((s) => s.status === "待安排" && !sessionIsPassed(s)));
    for (const s of sessions) {
      if (!s.formConfirmed) items.push({ step: "form", label: "确认面试形式", session: s, action: "mark-form" });
      if (!sessionIsFull(s)) items.push({ step: "schedule", label: "完成面试排班", session: s, action: "schedule" });
      if (!s.ticketReady) items.push({ step: "ticket", label: "完善候选人工单", session: s, action: "mark-ticket" });
      if (!s.notified) items.push({ step: "notice", label: "发送竞聘通知", session: s, action: "notice" });
    }
    return items;
  }

  function processDoneTodos() {
    const items = [];
    const sessions = sortSessions(state.sessions.filter((s) => s.status === "待安排" && !sessionIsPassed(s)));
    for (const s of sessions) {
      if (s.formConfirmed) items.push({ step: "form", label: "确认面试形式", session: s });
      if (sessionIsFull(s)) items.push({ step: "schedule", label: "完成面试排班", session: s });
      if (s.ticketReady) items.push({ step: "ticket", label: "完善候选人工单", session: s });
      if (s.notified) items.push({ step: "notice", label: "发送竞聘通知", session: s });
    }
    return items;
  }

  function computeStats() {
    const sessions = sortSessions(state.sessions.filter((s) => s.status !== "已取消" && (s.interviewers || []).length > 0));
    const total = {};
    const consec = {};
    const lastDate = {};
    const allIds = [];
    for (const dept of state.departments) {
      for (const p of dept.people) allIds.push(p.id);
    }
    for (const id of allIds) {
      let run = 0;
      for (const s of sessions) {
        const has = s.interviewers.some((iv) => iv.personId === id);
        run = has ? run + 1 : 0;
        if (has) lastDate[id] = s.date;
      }
      consec[id] = run;
      total[id] = sessions.reduce((n, s) => n + (s.interviewers.some((iv) => iv.personId === id) ? 1 : 0), 0);
    }
    return { total, consec, lastDate };
  }

  function rangeContains(range, dateStr) {
    const d = parseDate(dateStr);
    if (!d) return false;
    const start = parseDate(range.start);
    const end = parseDate(range.end);
    if (start && d.getTime() < start.getTime()) return false;
    if (end && d.getTime() > end.getTime()) return false;
    return true;
  }

  function personAvailable(person, dateStr) {
    if (!person.enabled) return false;
    if (person.unavailable && person.unavailable.length) {
      for (const range of person.unavailable) {
        if (rangeContains(range, dateStr)) return false;
      }
    }
    return true;
  }

  function hostAvailable(host, dateStr) {
    if (!host.enabled) return false;
    if (host.unavailable && host.unavailable.length) {
      for (const range of host.unavailable) {
        if (rangeContains(range, dateStr)) return false;
      }
    }
    return true;
  }

  function countRole(poolName, id) {
    const key = poolName === "hosts" ? "hostId" : "organizerId";
    return state.sessions.filter((s) => s.status !== "已取消" && s[key] === id).length;
  }

  function consecutiveRoleCount(poolName, id) {
    const key = poolName === "hosts" ? "hostId" : "organizerId";
    const sessions = sortSessions(state.sessions.filter((s) => s.status !== "已取消" && s[key]));
    let run = 0;
    for (const s of sessions) {
      run = s[key] === id ? run + 1 : 0;
    }
    return run;
  }

  function pickRole(poolName, session, excludedIds) {
    const key = poolName === "hosts" ? "hostId" : "organizerId";
    const pool = poolName === "hosts" ? state.hosts : state.organizers;
    if (!pool.length) return null;
    const cursorKey = poolName === "hosts" ? "hostIndex" : "organizerIndex";
    const cursor = (state.cursors[cursorKey] || 0) % pool.length;
    const candidates = pool.filter((h) => {
      if (!hostAvailable(h, session.date)) return false;
      if (excludedIds.has(h.id)) return false;
      return true;
    });
    if (!candidates.length) return null;
    candidates.sort((a, b) => {
      const overA = consecutiveRoleCount(poolName, a.id) >= (a.maxConsecutive || 1) ? 1 : 0;
      const overB = consecutiveRoleCount(poolName, b.id) >= (b.maxConsecutive || 1) ? 1 : 0;
      if (overA !== overB) return overA - overB;
      const ca = countRole(poolName, a.id);
      const cb = countRole(poolName, b.id);
      if (ca !== cb) return ca - cb;
      const orderA = (pool.indexOf(a) - cursor + pool.length) % pool.length;
      const orderB = (pool.indexOf(b) - cursor + pool.length) % pool.length;
      return orderA - orderB;
    });
    const picked = candidates[0];
    state.cursors[cursorKey] = (pool.indexOf(picked) + 1) % pool.length;
    return picked;
  }

  function peekNextHost(session) {
    const pool = state.hosts;
    if (!pool.length) return null;
    const cursor = (state.cursors.hostIndex || 0) % pool.length;
    const candidates = pool.filter((h) => hostAvailable(h, session.date));
    if (!candidates.length) return null;
    candidates.sort((a, b) => {
      const overA = consecutiveRoleCount("hosts", a.id) >= (a.maxConsecutive || 1) ? 1 : 0;
      const overB = consecutiveRoleCount("hosts", b.id) >= (b.maxConsecutive || 1) ? 1 : 0;
      if (overA !== overB) return overA - overB;
      const ca = countRole("hosts", a.id);
      const cb = countRole("hosts", b.id);
      if (ca !== cb) return ca - cb;
      const orderA = (pool.indexOf(a) - cursor + pool.length) % pool.length;
      const orderB = (pool.indexOf(b) - cursor + pool.length) % pool.length;
      return orderA - orderB;
    });
    return candidates[0];
  }

  function roleType(person) {
    return person.role === "中心负责人" ? "head" : person.role === "助理" ? "assistant" : null;
  }

  function pickPersonForDeptRole(dept, session, excludedIds, wantedRole) {
    const stats = computeStats();
    const maxDefault = state.settings.maxConsecutivePerPerson || 1;
    const candidates = dept.people.filter((p) => {
      if (!personAvailable(p, session.date)) return false;
      if (excludedIds.has(p.id)) return false;
      if (wantedRole && roleType(p) !== wantedRole) return false;
      return true;
    });
    if (!candidates.length) return null;
    candidates.sort((a, b) => {
      const online = (session.mode || "").includes("线上");
      const onlineA = online && a.name === "李小君" ? 1 : 0;
      const onlineB = online && b.name === "李小君" ? 1 : 0;
      if (onlineA !== onlineB) return onlineB - onlineA;
      const sa = stats.total[a.id] || 0;
      const sb = stats.total[b.id] || 0;
      const ca = stats.consec[a.id] || 0;
      const cb = stats.consec[b.id] || 0;
      const ma = a.maxConsecutive || maxDefault;
      const mb = b.maxConsecutive || maxDefault;
      const overA = ca >= ma ? 1 : 0;
      const overB = cb >= mb ? 1 : 0;
      if (overA !== overB) return overA - overB;
      if (sa !== sb) return sa - sb;
      const da = stats.lastDate[a.id] ? parseDate(stats.lastDate[a.id]).getTime() : -Infinity;
      const db = stats.lastDate[b.id] ? parseDate(stats.lastDate[b.id]).getTime() : -Infinity;
      if (da !== db) return da - db;
      return dept.people.indexOf(a) - dept.people.indexOf(b);
    });
    return candidates[0];
  }

  function selectDepartmentsForSession(session, count, excludedDeptIds, excludedPersonIds, advance, warnings) {
    const ordered = orderedDepartments();
    const deptIndexMap = new Map(ordered.map((d, i) => [d.id, i]));
    const excludedDeptSet = new Set(excludedDeptIds || []);
    const excludedPersons = excludedPersonIds || new Set();
    const stats = computeStats();
    const selected = [];
    const headQuota = state.settings.headsPerSession || 2;
    const assistantQuota = state.settings.assistantsPerSession || 3;
    const canSupply = (dept, role) => dept.people.some((p) => personAvailable(p, session.date) && roleType(p) === role);
    const headDepts = ordered.filter((d) => !excludedDeptSet.has(d.id) && canSupply(d, "head"));
    const assistantDepts = ordered.filter((d) => !excludedDeptSet.has(d.id) && canSupply(d, "assistant"));
    let headIdx = (state.cursors.headIndex || 0) % Math.max(1, headDepts.length);
    let assistantIdx = (state.cursors.assistantIndex || 0) % Math.max(1, assistantDepts.length);
    const selectedDeptIds = new Set(excludedDeptSet);
    const avoidPersons = new Set(excludedPersons);
    const selectedPersonIds = new Set(excludedPersons);
    const headSelectedIds = new Set();

    function pickFromQueue(queue, startIdx, role, quota, allowHeadFallback) {
      const picked = [];
      let idx = startIdx;
      let guard = 0;
      const maxGuard = queue.length * 4 + 20;
      while (picked.length < quota && guard < maxGuard) {
        guard += 1;
        if (!queue.length) break;
        const dept = queue[idx % queue.length];
        idx += 1;
        if (selectedDeptIds.has(dept.id) && !(allowHeadFallback && headSelectedIds.has(dept.id))) continue;
        const pass = state.cursors.deptPassCounts[dept.id] || 0;
        const freq = Math.max(1, dept.frequency || 1);
        if (pass % freq !== 0) {
          if (advance) state.cursors.deptPassCounts[dept.id] = pass + 1;
          continue;
        }
        const person = pickPersonForDeptRole(dept, session, avoidPersons, role);
        if (person) {
          const consec = stats.consec[person.id] || 0;
          const limit = person.maxConsecutive || state.settings.maxConsecutivePerPerson || 1;
          const hasAlternative = dept.people.some((p) =>
            p.id !== person.id && personAvailable(p, session.date) && !avoidPersons.has(p.id) && roleType(p) === role
          );
          if (consec >= limit && !hasAlternative) {
            if (advance) state.cursors.deptPassCounts[dept.id] = pass + 1;
            if (warnings) warnings.push(`${person.name}（${dept.shortName}）已连续参与，本轮先跳过`);
            continue;
          }
          picked.push({ dept, person, orderIndex: deptIndexMap.get(dept.id) });
          selectedDeptIds.add(dept.id);
          avoidPersons.add(person.id);
          selectedPersonIds.add(person.id);
          if (role === "head") headSelectedIds.add(dept.id);
          if (advance) state.cursors.deptPassCounts[dept.id] = pass + 1;
        } else {
          if (advance) state.cursors.deptPassCounts[dept.id] = pass + 1;
          if (warnings && !allowHeadFallback) warnings.push(`${dept.shortName || dept.name}当前没有可用的${role === "head" ? "中心负责人" : "助理"}，本轮顺延`);
        }
      }
      return { picked, nextIndex: idx };
    }

    const headResult = pickFromQueue(headDepts, headIdx, "head", headQuota);
    const assistantResult = pickFromQueue(assistantDepts, assistantIdx, "assistant", assistantQuota);
    if (assistantResult.picked.length < assistantQuota) {
      const missing = assistantQuota - assistantResult.picked.length;
      const fallback = pickFromQueue(assistantDepts, assistantResult.nextIndex, "assistant", missing, true);
      assistantResult.picked.push(...fallback.picked);
      assistantResult.nextIndex = fallback.nextIndex;
    }
    state.cursors.headIndex = headResult.nextIndex;
    state.cursors.assistantIndex = assistantResult.nextIndex;
    selected.push(...headResult.picked, ...assistantResult.picked);
    if (warnings) {
      if (headResult.picked.length < headQuota) warnings.push(`还差 ${headQuota - headResult.picked.length} 位中心负责人`);
      if (assistantResult.picked.length < assistantQuota) warnings.push(`还差 ${assistantQuota - assistantResult.picked.length} 位助理`);
    }
    return selected;
  }

  function fillSession(sessionOrId) {
    const session = typeof sessionOrId === "string" ? state.sessions.find((s) => s.id === sessionOrId) : sessionOrId;
    if (!session || session.status === "已取消") return { filled: 0, warnings: [] };
    const lockedAll = (session.interviewers || []).filter((iv) => iv.locked);
    const slots = Math.max(1, state.settings.interviewersPerSession || 5, lockedAll.length);
    const existing = lockedAll.slice(0, slots);
    const need = Math.max(0, slots - existing.length);
    const warnings = [];
    const lockedDepts = new Set(existing.map((iv) => iv.deptId).filter(Boolean));
    const lockedPersons = new Set(existing.map((iv) => iv.personId).filter(Boolean));
    let picked = [];
    if (need > 0) {
      picked = selectDepartmentsForSession(session, need, lockedDepts, lockedPersons, true, warnings);
    }
    const nextSlots = picked.map((item, i) => ({
      slot: existing.length + i,
      deptId: item.dept.id,
      personId: item.person.id,
      locked: false,
    }));
    for (let i = existing.length + picked.length; i < slots; i += 1) {
      nextSlots.push({ slot: i, deptId: null, personId: null, locked: false });
    }
    session.interviewers = [...existing, ...nextSlots].sort((a, b) => a.slot - b.slot);

    if (state.settings.hostPerSession) {
      const used = new Set(session.interviewers.map((iv) => iv.personId).filter(Boolean));
      if (session.hostName) {
        const existingHost = state.hosts.find((h) => h.name === session.hostName);
        if (existingHost) session.hostId = existingHost.id;
      } else if (!session.hostId) {
        const host = pickRole("hosts", session, used);
        if (host) session.hostId = host.id;
        else if (!session.hostId) warnings.push("主持人池无人可用，请补充主持人或调整不可用时间");
      }
    }
    if (state.settings.organizerPerSession) {
      const org = pickRole("organizers", session, new Set());
      if (org) session.organizerId = org.id;
      else if (!session.organizerId) warnings.push("组织实施人池无人可用，请补充人员");
    }
    return { filled: picked.length, warnings };
  }

  function fillUpcoming() {
    const targets = sortSessions(state.sessions.filter((s) => s.status === "待安排"));
    const allWarnings = [];
    let filled = 0;
    for (const s of targets) {
      const result = fillSession(s.id);
      filled += result.filled;
      result.warnings.forEach((w) => allWarnings.push(`${fmtDateShort(s.date)} ${s.time || ""}：${w}`));
    }
    saveAndRender();
    if (filled === 0 && allWarnings.length === 0) {
      showToast("待开展场次都已有人选，无需重排", "ok");
    } else {
      showToast(`已补排 ${filled} 个名额`, allWarnings.length ? "warn" : "ok");
    }
    if (allWarnings.length) {
      showToast(allWarnings[0], "warn");
      console.warn(allWarnings);
    }
  }

  function nextWeekdayDate(startIso, weekdays) {
    const d = parseDate(startIso);
    if (!d) return null;
    const set = new Set((weekdays || [2, 4]).map(Number));
    for (let i = 0; i < 8; i += 1) {
      if (set.has(d.getDay())) return dateKey(d);
      d.setDate(d.getDate() + 1);
    }
    return dateKey(d);
  }

  function generateSessions(count, startIso) {
    const weekdays = (state.settings.weekdays || [2, 4]).map(Number);
    let date = nextWeekdayDate(startIso || todayIso(), weekdays);
    const existing = new Set(state.sessions.map((s) => s.date));
    const created = [];
    let attempts = 0;
    while (created.length < count && attempts < count * 30 + 60) {
      attempts += 1;
      if (!date) break;
      if (!existing.has(date)) {
        const session = {
          id: uid("s"),
          date,
          time: state.settings.defaultTime || "14:00-14:40",
          mode: state.settings.defaultMode || "腾讯会议",
          candidates: "",
          status: "待安排",
          hostId: null,
          organizerId: null,
          note: "",
          interviewers: [],
        };
        state.sessions.push(session);
        existing.add(date);
        created.push(session);
        fillSession(session.id);
      }
      date = addDays(date, 1);
      date = nextWeekdayDate(date, weekdays);
    }
    saveAndRender();
    showToast(`已生成并排好 ${created.length} 场`, "ok");
    return created;
  }

  function clearAutoAssignments() {
    let cleared = 0;
    for (const s of state.sessions) {
      if (s.status !== "待安排") continue;
      const kept = (s.interviewers || []).filter((iv) => iv.locked);
      cleared += s.interviewers.length - kept.length;
      s.interviewers = kept;
    }
    saveAndRender();
    showToast(`已清空 ${cleared} 个未锁定名额`, "ok");
  }

  function resetCursor() {
    state.cursors.deptIndex = 0;
    state.cursors.headIndex = 0;
    state.cursors.assistantIndex = 0;
    for (const d of state.departments) state.cursors.deptPassCounts[d.id] = 0;
    state.cursors.hostIndex = 0;
    state.cursors.organizerIndex = 0;
    saveAndRender();
    showToast("轮值指针已重置到第一位", "ok");
  }

  function skipCurrentRotation() {
    const info = currentRotationInfo();
    if (info.headDepts.length) state.cursors.headIndex = (info.headIndex + 1) % info.headDepts.length;
    const assistantList = orderedDepartments().filter((d) => d.people.some((p) => p.enabled && p.role === "助理"));
    if (assistantList.length) state.cursors.assistantIndex = (state.cursors.assistantIndex + 1) % assistantList.length;
    saveAndRender();
    showToast("已跳过本轮中心", "ok");
  }

  // ---------- storage ----------

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.departments && parsed.sessions) return normalizeState(parsed);
      }
    } catch (err) {
      console.warn("读取本地数据失败", err);
    }
    return normalizeState(deepClone(window.SEED_DATA));
  }

  function normalizeState(input) {
    const s = deepClone(input);
    const hostRename = {
      "思嘉": "连思嘉",
      "彭彭": "彭魁博",
      "雨涵": "和雨涵",
      "俊杰": "陆俊杰",
      "思铭": "刘思铭",
      "刘思铭": "刘思铭",
    };
    s.settings = Object.assign({
      headsPerSession: 2,
      assistantsPerSession: 3,
      interviewersPerSession: 5,
      maxConsecutivePerPerson: 1,
      hostPerSession: 1,
      organizerPerSession: 1,
      defaultMode: "腾讯会议",
      defaultTime: "14:00-14:40",
      weekdays: [2, 4],
      lockPassword: "123456",
    }, s.settings || {});
    s.settings.headsPerSession = s.settings.headsPerSession == null ? 2 : s.settings.headsPerSession;
    s.settings.assistantsPerSession = s.settings.assistantsPerSession == null ? 3 : s.settings.assistantsPerSession;
    s.settings.interviewersPerSession = (s.settings.headsPerSession || 0) + (s.settings.assistantsPerSession || 0);
    s.cursors = Object.assign({ deptIndex: 0, headIndex: 0, assistantIndex: 0, deptPassCounts: {}, hostIndex: 0, organizerIndex: 0 }, s.cursors || {});
    s.cursors.deptPassCounts = s.cursors.deptPassCounts || {};
    s.departments = (s.departments || []).map((d) => {
      d.people = (d.people || []).map((p) => {
        p.enabled = p.enabled !== false;
        p.unavailable = p.unavailable || [];
        p.maxConsecutive = Math.max(1, Math.min(10, Number(p.maxConsecutive) || 1));
        return p;
      });
      return d;
    });
    s.hosts = (s.hosts || []).map((h) => ({
      ...h,
      name: hostRename[h.name] || h.name,
    }));
    const seenHosts = new Set();
    s.hosts = s.hosts.filter((h) => {
      if (seenHosts.has(h.name)) return false;
      seenHosts.add(h.name);
      return true;
    });
    s.hosts = s.hosts.map((h) => {
      h.enabled = h.enabled !== false;
      h.unavailable = h.unavailable || [];
      h.maxConsecutive = Math.max(1, Math.min(10, Number(h.maxConsecutive) || 1));
      return h;
    });
    s.organizers = (s.organizers || []).map((o) => {
      o.enabled = o.enabled !== false;
      o.unavailable = o.unavailable || [];
      o.maxConsecutive = Math.max(1, Math.min(10, Number(o.maxConsecutive) || 1));
      return o;
    });
    s.sessions = (s.sessions || []).map((x) => {
      if (x.hostName) x.hostName = hostRename[x.hostName] || x.hostName;
      x.interviewers = x.interviewers || [];
      x.status = x.status || "待安排";
      x.notified = x.notified === true;
      x.formConfirmed = x.formConfirmed === true;
      x.ticketReady = x.ticketReady === true;
      x.locked = x.locked === true;
      if (x.status === "已开展") {
        x.notified = true;
        x.formConfirmed = true;
        x.ticketReady = true;
      }
      return x;
    });
    return s;
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const el = $("#saveState");
      if (el) {
        el.textContent = "已保存";
        el.style.color = "";
      }
    } catch (err) {
      const el = $("#saveState");
      if (el) {
        el.textContent = "浏览器无法保存，请导出 JSON";
        el.style.color = "var(--rose)";
      }
      console.warn("保存失败", err);
    }
    if (serverMode) {
      clearTimeout(serverSaveTimer);
      serverSaveTimer = setTimeout(postStateToServer, 250);
    }
  }

  async function postStateToServer() {
    try {
      await fetch(`${API_BASE}/api/state`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state),
      });
    } catch (err) {
      console.warn("服务器保存失败", err);
    }
  }

  function saveAndRender() {
    saveState();
    markPassedSessions();
    renderCurrentView();
  }

  // ---------- UI helpers ----------

  function showToast(message, type = "") {
    const root = $("#toastRoot");
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    el.textContent = message;
    root.appendChild(el);
    setTimeout(() => {
      el.style.opacity = "0";
      el.style.transition = "opacity .3s ease";
      setTimeout(() => el.remove(), 320);
    }, 2600);
  }

  function openModal(htmlContent) {

    root.innerHTML = htmlContent;
    if (window.lucide) window.lucide.createIcons(root);
    return root;

  function closeModal() {

  function statusPill(status) {
    const cls = status === "已开展" ? "done" : status === "已取消" ? "cancel" : "todo";
    return `<span class="status-pill ${cls}">${status === "待安排" ? "待开展" : esc(status)}</span>`;

  function progressPill(progress) {
    return `<span class="status-pill ${progress.tone}">${esc(progress.label)}</span>`;
  }

  function personChips(session) {
    const stats = computeStats();
    const items = (session.interviewers || []).slice().sort((a, b) => a.slot - b.slot);
    if (!items.length) return `<span class="chip missing">未排</span>`;
    return `<span class="chips">${items.map((iv) => {
      if (!iv.personId) return `<span class="chip missing">缺员</span>`;
      const dept = findDept(iv.deptId);
      const person = findPerson(iv.personId);
      const name = person ? person.name : "未知";
      const short = dept ? dept.shortName : "?";
      const color = dept ? dept.color : "#64748b";
      const consec = stats.consec[iv.personId] || 0;
      const limit = person ? (person.maxConsecutive || 1) : 1;
      const risk = consec > 1 && consec >= limit;
      const title = `${name} · ${dept ? dept.name : ""} · 累计${stats.total[iv.personId] || 0}场 · 连续${consec}场${risk ? "（建议换人）" : ""}`;
      const chipColor = risk ? "#b45309" : color;
      const chipBg = risk ? "#fdf0dd" : `${color}14`;
      return `<span class="chip" style="border-color:${chipColor}22;background:${chipBg};color:${chipColor}" title="${esc(title)}"><span class="dot"></span>${esc(name)}${risk ? " 连" : ""}<span style="opacity:.72">${esc(short)}</span></span>`;
    }).join("")}</span>`;
  }

  function hostDisplayName(session) {
    return session.hostName || (session.hostId ? (findHost(session.hostId) || {}).name || "" : "") || "";

  function fixHostName(name) {
    const map = {
      "思嘉": "连思嘉",
      "彭彭": "彭魁博",
      "雨涵": "和雨涵",
      "俊杰": "陆俊杰",
      "思铭": "刘思铭",
      "刘思铭": "刘思铭",
    };
    return map[name] || name;
  }

  function sessionUnlocked(session) {
    return !session.locked || Boolean(window.__unlockedSessions && window.__unlockedSessions.has(session.id));
  }

  function buildNoticeText(session) {
    const timeDisplay = (session.time || "14:00-14:40").trim().replace("-", "–");
    const rawCandidate = (session.candidates || "").split("\n").map((s) => s.trim()).find(Boolean) || "";
    const candidateMatch = rawCandidate.match(/(.+?)外聘区域总监【(.+?)】/);
    let region = "";
    let name = "";
    if (candidateMatch) {
      region = candidateMatch[1].trim();
      name = candidateMatch[2].trim();
    } else {
      const nameMatch = rawCandidate.match(/【(.+?)】/);
      name = nameMatch ? nameMatch[1].trim() : (rawCandidate || "待定");
    }
    const mode = (session.mode || "").trim();
    const form = mode === "线下" ? "**线下**" : "**腾讯会议**（会议号由主持人私聊发送）";
    const host = hostDisplayName(session) || "xxx";
    const interviewerLines = (session.interviewers || [])
      .filter((iv) => iv.personId && iv.deptId)
      .map((iv) => {
        const dept = findDept(iv.deptId);
        const person = findPerson(iv.personId);
        return `${dept ? dept.name : "未知中心"} ${person ? person.name : "未知"}`;
      });
    const interviewerBlock = interviewerLines.length ? interviewerLines.map((line) => ` • ${line}`).join("\n") : " • 待定";
    return [
      "📣 **【竞聘通知｜外聘区域总监】**",

      "",

      "",
      "👤 **竞聘人员**",
      ` **${name}**`,
      "",
      "💻 **竞聘形式**",
      ` ${form}`,
      "",
      "🎙️ **竞聘主持**",

      interviewerBlock,
      "",
      "📌 **温馨提示**",
      " 请各位面试官提前安排好时间，准时参会。",
    ].join("\n");
  }

  function nextGroupDeadline() {
    const now = new Date();
    for (let i = 0; i < 8; i += 1) {
      const d = new Date(now);
      d.setDate(now.getDate() + i);
      d.setHours(15, 0, 0, 0);
      if ((d.getDay() === 1 || d.getDay() === 3) && d.getTime() > now.getTime()) return d;
    }
    return null;
  }

  function sendDeadlineForSession(session) {
    const d = parseDate(session && session.date);
    if (!d) return null;
    const dl = new Date(d);
    const day = d.getDay();
    if (day === 2 || day === 4) {
      dl.setDate(dl.getDate() - 1);
    } else {
      while (dl.getDay() !== 1 && dl.getDay() !== 3) {
        dl.setDate(dl.getDate() - 1);
      }
    }
    dl.setHours(15, 0, 0, 0);
    return dl;
  }

  function nextPendingSession() {
    return sortSessions(state.sessions.filter((s) => s.status === "待安排"))[0] || null;
  }

  function deadlineLabel(deadline) {
    return deadline ? `${fmtDateCn(dateKey(deadline))} 15:00` : "-";
  }

  function scheduleGroupReminder(session) {
    const deadline = (session ? sendDeadlineForSession(session) : null) || nextGroupDeadline();
    if (!deadline) return;
    const remindAt = deadline.getTime() - 30 * 60 * 1000;
    const delay = remindAt - Date.now();
    if (delay <= 0) return;
    setTimeout(() => {
      try {
        new Notification("竞聘通知发送提醒", {
          body: `请将竞聘通知在 ${deadlineLabel(deadline)} 前发送到【集团职能中心直属群】`,
        });
      } catch (err) {
        console.warn("通知失败", err);
      }
      scheduleGroupReminder(nextPendingSession());
    }, delay);
  }

  function enableGroupReminder() {
    if (!("Notification" in window)) {
      showToast("当前浏览器不支持通知提醒", "warn");
      return;
    }
    Notification.requestPermission().then((permission) => {
      if (permission === "granted") {
        scheduleGroupReminder(nextPendingSession());
        showToast("已开启到点提醒", "ok");
      } else {
        showToast("未授权通知，请在浏览器设置中允许", "warn");
      }
    }).catch(() => showToast("无法开启通知提醒", "warn"));
  }

  function copyText(text, message) {
    const done = () => showToast(message || "通知已复制", "ok");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {
        fallbackCopy(text);
        done();
      });
      return;
    }
    fallbackCopy(text);
    done();
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
    } catch (err) {
      console.warn("复制失败", err);
    }
    ta.remove();
  }

  function deptChip(dept) {
    return `<span class="chip neutral" style="border-color:${dept.color}30;background:${dept.color}10;color:${dept.color}"><span class="dot"></span>${esc(dept.shortName || dept.name)}</span>`;
  }

  function toggleSwitch(on, action, id) {
    return `<button class="switch ${on ? "on" : ""}" data-action="${esc(action)}" data-id="${esc(id)}" data-on="${on ? 1 : 0}" type="button" role="switch" aria-checked="${on ? "true" : "false"}"></button>`;
  }

  // ---------- view rendering ----------

  function renderCurrentView() {
    if (currentView === "dashboard") renderDashboard();
    if (currentView === "calendar") renderCalendar();
    if (currentView === "records") renderRecords();
    if (currentView === "overview") renderOverview();
    if (currentView === "schedule") renderSchedule();
    if (currentView === "roster") renderRoster();
    if (currentView === "rotation") renderRotation();
    if (currentView === "auto") renderAuto();
    if (currentView === "process") renderProcess();

  function renderDashboard() {
    const root = $("#view-dashboard");
    const today = todayIso();
    const weekStart = startOfWeekIso(today);
    const weekEnd = addDays(weekStart, 6);
    const sessions = sortSessions(state.sessions.filter((s) => s.status !== "已取消"));
    const todayCount = sessions.filter((s) => s.date === today).length;
    const weekCount = sessions.filter((s) => s.date >= weekStart && s.date <= weekEnd).length;
    const pendingConfirm = sessions.filter((s) => sessionProgress(s).label === "待确认").length;
    const pendingNotice = sessions.filter((s) => sessionProgress(s).label === "待通知").length;
    const upcoming = sortSessions(sessions.filter((s) => s.status === "待安排" && !sessionIsPassed(s))).slice(0, 3);
    const overviewSessions = sortSessions(sessions.filter((s) => s.status === "待安排" && !sessionIsPassed(s)));
    const todos = processTodos().slice(0, 12);
    const doneTodos = processDoneTodos().slice(0, 12);
    const monthSessions = sessions.filter((s) => {
      const d = parseDate(s.date);
      const now = new Date();
      return d && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }).length;

    const recentCards = overviewSessions.length ? overviewSessions.map((s) => {
      const progress = sessionProgress(s);
      const inWeek = s.date >= weekStart && s.date <= weekEnd;
      const badge = inWeek ? { text: "本周", cls: "ok" } : { text: "后续", cls: "neutral" };
      const warnings = [];
      if (!sessionIsFull(s)) warnings.push("缺少面试官");
      if (!hostDisplayName(s)) warnings.push("主持人未确认");
      if (progress.label === "待通知") warnings.push("通知尚未发送");
      if (sessionHasPausedPerson(s)) warnings.push("暂停面试官被安排");
      return `
        <div class="recent-card">
          <div class="recent-head">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <strong>${fmtDateShortWeekday(s.date)} · ${esc(s.time)}</strong>
              <span class="chip ${badge.cls}">${badge.text}</span>
              ${s.locked ? `<span class="chip neutral">🔒 已锁定</span>` : ""}
            </div>
            ${progressPill(progress)}
          </div>
          <div class="recent-candidate">${esc(s.candidates || "待定")}</div>
          <div class="recent-meta">面试官：${personChips(s)}</div>
          <div class="recent-meta">主持人：${esc(hostDisplayName(s)) || "未确认"}</div>
          ${warnings.length ? `<div class="warn-line">${warnings.map((w) => "⚠️ " + w).join(" · ")}</div>` : ""}
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn small blue" data-action="copy-notice" data-id="${esc(s.id)}"><i data-lucide="copy"></i>复制通知</button>
            <button class="btn small" data-action="edit-session" data-id="${esc(s.id)}"><i data-lucide="eye"></i>查看详情</button>
          </div>
        </div>
      `;
    }).join("") : '<div class="empty"><div class="big">暂无待开展场次</div><p>可以在右上角“新增竞聘”添加场次。</p></div>';

    const todoHtml = todos.length ? todos.map((item) => `
      <div class="todo-item">
        <span class="todo-mark">⚠️</span>
        <div class="todo-text">
          <div class="todo-step-main">${esc(item.label)}</div>
          <div class="todo-tags"><span class="chip neutral">${fmtDateShort(item.session.date)} · ${esc(candidateShortName(item.session))}</span></div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn small blue" data-action="${item.action === "mark-form" || item.action === "mark-ticket" ? "complete-todo" : item.action === "notice" ? "copy-notice" : "edit-session"}" data-step="${item.action === "mark-form" || item.action === "mark-ticket" ? item.step : ""}" data-id="${esc(item.session.id)}">处理</button>

  function candidateShortName(session) {
    const line = (session.candidates || "").split("\n")[0] || "";

  }

  function sessionMatchesFilter(session) {
    if (calendarFilter === "all") return true;
    return sessionProgress(session).label === calendarFilter;
  }

  function renderCalendar() {
    const root = $("#view-calendar");
    if (!calendarWeekStart) calendarWeekStart = startOfWeekIso(todayIso());

    const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
    const q = scheduleQuery.trim().toLowerCase();
    const weekSessions = sortSessions(state.sessions.filter((s) => {
      const inWeek = s.date >= weekStart && s.date <= addDays(weekStart, 6);
      if (!inWeek || !sessionMatchesFilter(s)) return false;
      if (!q) return true;
      return `${s.date} ${s.time} ${s.candidates} ${s.note}`.toLowerCase().includes(q) ||
        (s.interviewers || []).some((iv) => {
          const p = findPerson(iv.personId);

    const filters = ["全部", "待确认", "待通知", "已确认", "已完成", "异常"];

  function createDraftSession() {
    draftHostAdvanced = false;

  function openSessionModal(sessionId) {
    const isNew = sessionId === "new";
    const session = isNew ? (draftSession || createDraftSession()) : state.sessions.find((s) => s.id === sessionId);
    if (!session) return;
    if (!window.__unlockedSessions) window.__unlockedSessions = new Set();
    if (!isNew && session.locked && !window.__unlockedSessions.has(session.id)) {
      promptModal("场次已锁定", "请输入解锁密码", "", (pwd) => {
        if (pwd === (state.settings.lockPassword || "123456")) {
          window.__unlockedSessions.add(session.id);
          openSessionModal(sessionId);
        } else {
          showToast("密码错误，无法修改", "warn");
        }
      });
      return;
    }
    selectedSessionId = sessionId;
    if (isNew && !session.hostId) {
      const nextHost = peekNextHost(session);
      if (nextHost) session.hostId = nextHost.id;
    }
    let hostOptions = state.hosts.map((h) => `<option value="${esc(h.id)}" ${session.hostId === h.id ? "selected" : ""}>${esc(h.name)}</option>`).join("");
    if (!isNew && !session.hostId && session.hostName) {
      hostOptions = `<option value="" selected>${esc(session.hostName)}（原表）</option>` + hostOptions;
    }
    const currentMode = (session.mode || "").trim();
    const modeValue = currentMode.includes("腾讯会议") ? "腾讯会议" : (currentMode.includes("线下") || currentMode.includes("会议室")) ? "线下" : (currentMode || "腾讯会议");
    let modeOptions = `<option value="腾讯会议" ${modeValue === "腾讯会议" ? "selected" : ""}>腾讯会议</option><option value="线下" ${modeValue === "线下" ? "selected" : ""}>线下</option>`;
    if (modeValue !== "腾讯会议" && modeValue !== "线下") {
      modeOptions += `<option value="${esc(modeValue)}" selected>${esc(modeValue)}</option>`;
    }
    const timeParts = (session.time || "14:00-14:40").split("-");
    const timeStart = (timeParts[0] || "").trim() || "14:00";
    const timeEnd = (timeParts[1] || "").trim() || "14:40";
    const slots = session.interviewers || [];
    const maxSlot = Math.max(state.settings.interviewersPerSession || 5, slots.length);
    const depts = orderedDepartments();
    const rows = [];
    for (let i = 0; i < maxSlot; i += 1) {
      const iv = slots.find((x) => x.slot === i) || { slot: i, deptId: "", personId: "", locked: false };
      const slotPerson = iv.personId ? findPerson(iv.personId) : null;
      const roleLabel = slotPerson ? (slotPerson.role || (i < (state.settings.headsPerSession || 2) ? "中心负责人" : "助理")) : (i < (state.settings.headsPerSession || 2) ? "中心负责人" : "助理");
      const deptOptions = `<option value="">选择部门</option>${depts.map((d) => `<option value="${esc(d.id)}" ${iv.deptId === d.id ? "selected" : ""}>${esc(d.name)}</option>`).join("")}`;
      const people = iv.deptId ? (findDept(iv.deptId)?.people || []) : [];

  // ---------- import / export ----------

  function downloadFile(name, content, mime) {
    const blob = new Blob([content], { type: mime || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportExcel() {
    if (!window.XLSX) {
      exportCsv();
      showToast("Excel 解析库未加载，已改为导出 CSV", "warn");
      return;
    }
    const rosterRows = [["部门", "部门简称", "轮值频率", "面试官", "角色", "启用", "连续上限", "备注"]];
    for (const dept of orderedDepartments()) {
      for (const p of dept.people) {
        rosterRows.push([dept.name, dept.shortName, dept.frequency, p.name, p.role, p.enabled ? "是" : "否", p.maxConsecutive, p.note]);
      }
    }
    const maxSlots = Math.max(1, state.settings.interviewersPerSession || 5);
    const sessionHead = ["日期", "时间", "开展模式", "竞聘人员", "状态", "主持人", "组织实施人"];
    for (let i = 1; i <= maxSlots; i += 1) sessionHead.push(`面试官${i}`, `部门${i}`);
    sessionHead.push("备注");
    const sessionRows = [sessionHead];
    for (const s of sortSessions(state.sessions)) {
      const row = [s.date, s.time, s.mode, s.candidates, s.status, s.hostName || findHost(s.hostId)?.name || "", findOrganizer(s.organizerId)?.name || ""];
      const ivs = (s.interviewers || []).slice().sort((a, b) => a.slot - b.slot);
      for (let i = 0; i < maxSlots; i += 1) {
        const iv = ivs[i];
        row.push(iv && iv.personId ? (findPerson(iv.personId)?.name || "") : "");
        row.push(iv && iv.deptId ? (findDept(iv.deptId)?.name || "") : "");
      }
      row.push(s.note || "");
      sessionRows.push(row);
    }
    const rotationRows = [["部门", "部门简称", "轮值顺序", "轮值频率"]];
    orderedDepartments().forEach((d, i) => rotationRows.push([d.name, d.shortName, i + 1, d.frequency]));
    const hostRows = [["姓名", "启用", "连续几场后换人", "备注"]];
    state.hosts.forEach((h) => hostRows.push([h.name, h.enabled ? "是" : "否", h.maxConsecutive, h.note || ""]));
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(rosterRows), "面试官库");
    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(sessionRows), "排班表");
    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(rotationRows), "轮值设置");
    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(hostRows), "主持人");
    window.XLSX.writeFile(wb, "面试官轮值排班表.xlsx");
    showToast("已导出 Excel", "ok");
  }

  function exportCsv() {
    const head = ["日期", "时间", "开展模式", "竞聘人员", "状态", "主持人", "组织实施人", "面试官", "部门", "备注"];
    const rows = [head];
    for (const s of sortSessions(state.sessions)) {
      const names = (s.interviewers || []).slice().sort((a, b) => a.slot - b.slot).map((iv) => iv.personId ? (findPerson(iv.personId)?.name || "") : "").join("、");
      const depts = (s.interviewers || []).slice().sort((a, b) => a.slot - b.slot).map((iv) => iv.deptId ? (findDept(iv.deptId)?.name || "") : "").join("、");
      rows.push([s.date, s.time, s.mode, s.candidates, s.status, s.hostName || findHost(s.hostId)?.name || "", findOrganizer(s.organizerId)?.name || "", names, depts, s.note]);
    }
    const csv = "\uFEFF" + rows.map((r) => r.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    downloadFile("面试官轮值排班表.csv", csv, "text/csv;charset=utf-8");
  }

  async function importFile(file) {
    const isXlsx = /\.xlsx?$/i.test(file.name);
    if (isXlsx && window.XLSX) {
      try {
        const buffer = await file.arrayBuffer();
        const wb = window.XLSX.read(buffer, { type: "array" });
        const parsed = parseExportedWorkbook(wb);
        if (parsed) {
          state = normalizeState(parsed);
          saveAndRender();
          showToast("已从 Excel 导入", "ok");
          return;
        }
      } catch (err) {
        console.error(err);
        showToast("Excel 解析失败，请导入 JSON", "error");
        return;
      }
    }
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed.departments || !parsed.sessions) throw new Error("缺少 departments/sessions");
      state = normalizeState(parsed);
      saveAndRender();
      showToast("已导入 JSON", "ok");
    } catch (err) {
      console.error(err);
      showToast("导入失败：文件格式不正确", "error");
    }
  }

  function parseExportedWorkbook(wb) {
    const rosterSheet = wb.Sheets["面试官库"];
    const sessionSheet = wb.Sheets["排班表"];
    const rotationSheet = wb.Sheets["轮值设置"];
    const hostSheet = wb.Sheets["主持人"];
    if (!rosterSheet || !sessionSheet) return null;
    const roster = window.XLSX.utils.sheet_to_json(rosterSheet, { defval: "" });
    const departments = [];
    const deptMap = {};
    let order = 0;
    for (const row of roster) {
      const name = String(row["部门"] || "").trim();
      if (!name) continue;
      if (!deptMap[name]) {
        const dept = {
          id: "d_" + order,
          name,
          shortName: String(row["部门简称"] || name),
          order,
          frequency: Number(row["轮值频率"] || 1) || 1,
          color: ["#2563eb", "#0f766e", "#7c3aed", "#b45309", "#be123c", "#4f46e5", "#0d9488", "#d97706", "#db2777", "#059669", "#1d4ed8"][order % 11],
          note: "",
          people: [],
        };
        departments.push(dept);
        deptMap[name] = dept;
        order += 1;
      }
      const dept = deptMap[name];
      const personName = String(row["面试官"] || "").trim();
      if (!personName) continue;
      dept.people.push({
        id: `${dept.id}_${dept.people.length}`,
        name: personName,
        role: String(row["角色"] || ""),
        enabled: String(row["启用"] || "是") !== "否",
        maxConsecutive: Number(row["连续上限"] || 2) || 2,
        note: String(row["备注"] || ""),
        unavailable: [],
      });
    }
    if (!departments.length) return null;
    const personIndex = {};
    for (const d of departments) for (const p of d.people) personIndex[`${d.name}|${p.name}`] = { deptId: d.id, personId: p.id };
    const sessionRows = window.XLSX.utils.sheet_to_json(sessionSheet, { defval: "" });
    const sessions = [];
    for (const row of sessionRows) {
      const date = String(row["日期"] || "").trim();
      if (!date) continue;
      const hostName = String(row["主持人"] || "").trim();
      const interviewers = [];
      for (let i = 1; i <= 10; i += 1) {
        const person = String(row[`面试官${i}`] || "").trim();
        const deptName = String(row[`部门${i}`] || "").trim();
        if (!person) continue;
        const key = `${deptName}|${person}`;
        const ref = personIndex[key] || { deptId: deptName, personId: "unknown_" + person };
        interviewers.push({ slot: interviewers.length, deptId: ref.deptId, personId: ref.personId, locked: true });
      }
      sessions.push({
        id: uid("imp"),
        date,
        time: String(row["时间"] || "14:00-14:40"),
        mode: String(row["开展模式"] || "腾讯会议"),
        candidates: String(row["竞聘人员"] || ""),
        status: String(row["状态"] || "待安排"),
        hostName,
        hostId: null,
        organizerId: null,
        note: String(row["备注"] || ""),
        interviewers,
      });
    }
    let rotationOrder = departments.map((d) => d.id);
    if (rotationSheet) {
      const rot = window.XLSX.utils.sheet_to_json(rotationSheet, { defval: "" });
      rotationOrder = rot
        .map((r) => String(r["部门"] || "").trim())
        .filter((n) => deptMap[n])
        .map((n) => deptMap[n].id);
    }
    departments.forEach((d, i) => {
      const idx = rotationOrder.indexOf(d.id);
      d.order = idx >= 0 ? idx : i;
    });
    let hosts = [];
    if (hostSheet) {
      const hostRows = window.XLSX.utils.sheet_to_json(hostSheet, { defval: "" });
      hosts = hostRows.map((h, i) => ({
        id: "host_" + i,
        name: String(h["姓名"] || "").trim(),
        enabled: String(h["启用"] || "是") !== "否",
        maxConsecutive: Number(h["连续几场后换人"] || 1) || 1,
        note: String(h["备注"] || ""),
        unavailable: [],
      })).filter((h) => h.name);
    }
    if (!hosts.length) {
      hosts = ["连思嘉", "彭魁博", "和雨涵", "陆俊杰", "刘思铭"].map((name, i) => ({
        id: "host_" + i,
        name,
        enabled: true,
        maxConsecutive: 1,
        note: "主持人",
        unavailable: [],
      }));
    }
    const hostMap = new Map(hosts.map((h) => [h.name, h.id]));
    for (const s of sessions) {
      if (s.hostName && hostMap.has(s.hostName)) s.hostId = hostMap.get(s.hostName);
      delete s.hostName;
    }
    const organizers = [];
    const pass = {};
    for (const d of departments) pass[d.id] = 0;
    let lastOrder = 0;
    for (const s of sessions) {
      for (const iv of s.interviewers) {
        pass[iv.deptId] = (pass[iv.deptId] || 0) + 1;
        const dept = departments.find((d) => d.id === iv.deptId);
        if (dept) lastOrder = dept.order;
      }
    }
    for (const d of departments) pass[d.id] = (pass[d.id] || 0) * d.frequency;
    return {
      version: 1,
      settings: { headsPerSession: 2, assistantsPerSession: 3, interviewersPerSession: 5, maxConsecutivePerPerson: 1, hostPerSession: 1, organizerPerSession: 0, defaultMode: "腾讯会议", defaultTime: "14:00-14:40", weekdays: [2, 4] },
      departments,
      hosts,
      organizers,
      sessions,
      cursors: { deptIndex: (lastOrder + 1) % departments.length, deptPassCounts: pass, hostIndex: 0, organizerIndex: 0 },
      meta: { title: "导入排班数据" },
    };
  }

    $$(".view").forEach((section) => section.classList.toggle("active", section.id === `view-${view}`));

  function setByPath(path, value, type) {
    const parts = path.split(".");
    let obj = state;
    for (let i = 0; i < parts.length - 1; i += 1) {
      if (obj[parts[i]] == null) obj[parts[i]] = {};
      obj = obj[parts[i]];
    }
    const key = parts[parts.length - 1];
    if (type === "int") obj[key] = parseInt(value, 10) || 0;
    else if (type === "bool") obj[key] = value === "true" || value === true;
    else obj[key] = value;
  }

  function deptIndexById(id) {
    return orderedDepartments().findIndex((d) => d.id === id);
  }

  function moveDept(id, dir) {
    const list = orderedDepartments();
    const idx = list.findIndex((d) => d.id === id);
    const target = idx + dir;
    if (idx < 0 || target < 0 || target >= list.length) return;
    const a = list[idx];
    const b = list[target];
    const tmp = a.order;
    a.order = b.order;
    b.order = tmp;
    saveAndRender();
  }

  function togglePerson(id) {
    const p = findPerson(id);
    if (!p) return;
    p.enabled = !p.enabled;
    saveAndRender();
  }

  function deletePerson(id) {
    const p = findPerson(id);
    const dept = state.departments.find((d) => d.people.some((x) => x.id === id));
    if (!p || !dept) return;
    if (!confirm(`确定删除 ${p.name}？历史场次中的名字会保留为未知。`)) return;
    dept.people = dept.people.filter((x) => x.id !== id);
    saveAndRender();
  }
